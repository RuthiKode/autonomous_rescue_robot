# Defaults for `ros2 run rescue_eval run_eval`. Command-line options override them.

method: none                # label of the condition being evaluated
duration_s: 20.0            # sim seconds to record when no drive file is given
startup_timeout_s: 120.0    # wall seconds to wait for sim time and odometry
run_timeout_factor: 10.0    # give up after (sim seconds * factor + 30) wall seconds
shutdown_timeout_s: 20.0    # wall seconds between SIGINT and SIGKILL
output_dir: results         # relative to the current directory unless absolute
csv_name: runs.csv

# Runs with --slam
slam:
  ready_timeout_s: 60.0     # wall seconds to wait for map -> base_link before driving
  post_drive_settle_s: 6.0  # sim seconds after the drive, so SLAM can finish and publish /map
  map_save_timeout_s: 30.0  # wall seconds allowed for map_saver_cli
  map_wait_s: 10.0          # map_saver_cli's own wait for /map (its default of 2 s failed once)
  trajectory_rate_hz: 10.0  # sampling rate of map -> base_link against Gazebo truth
  tf_wait_s: 1.0            # sim seconds to wait for a transform before dropping a sample

# Topics written to the rosbag. Topics that do not exist yet are simply empty.
# Camera images are left out on purpose: they dominate the bag size.
record_topics:
  - /scan
  - /imu
  - /odom_raw
  - /odometry/filtered
  - /camera/camera_info
  - /cmd_vel
  - /tf
  - /tf_static
  - /map
  - /slam_toolbox/graph_visualization
  - /robot_description
  - /detections
  - /survivors
  - /mission/state
  - /ground_truth/survivors
  - /ground_truth/survivor_markers
  - /ground_truth/odom
