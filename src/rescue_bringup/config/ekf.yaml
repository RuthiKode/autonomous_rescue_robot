# robot_localization EKF: the only publisher of odom -> base_link.
#
# Wheel odometry supplies forward and lateral velocity. The IMU gyro supplies
# the yaw rate. Wheel yaw rate is left out on purpose: the wheels slip and
# pivot in turns, so it is the least trustworthy signal on this robot.
# The Gazebo IMU orientation is not fused either, because it is noise-free.
#
# Each *_config row is: x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
