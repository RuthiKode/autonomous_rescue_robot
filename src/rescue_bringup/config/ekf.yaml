# robot_localization EKF: the only publisher of odom -> base_link.
#
# Wheel odometry supplies forward, lateral and yaw velocity. The IMU gyro also
# supplies yaw velocity. Both yaw rates are fused and weighted by the covariances
# that covariance_stamper writes into the messages
# (rescue_simulation/config/sensor_covariances.yaml): gyro 4.0e-6, wheels 5.0e-4,
# so the gyro dominates and the wheels mainly hold back gyro bias when standing.
# The Gazebo IMU orientation is not fused, because it has no noise model.
#
# Each *_config row is: x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
