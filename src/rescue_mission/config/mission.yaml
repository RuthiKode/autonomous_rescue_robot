# Mission tree parameters (docs/PLAN.md, stage 7). Values here override the defaults in behaviours.py.
mission_tree:
  ros__parameters:
    time_limit_s: 900.0          # sim seconds; the mission then ends as DONE
    tick_period_ms: 200
    reselect_delay_s: 2.0        # wait before asking the selector again after an empty answer
    progress_timeout_s: 30.0     # a goal with no progress for this long is a stuck robot ...
    progress_min_m: 0.3          # ... "progress" meaning at least this much closer
    goal_timeout_s: 150.0        # hard limit per goal
    repeat_radius_m: 1.0         # a goal this close to a reached one is blacklisted
    confirm_empty: 3             # empty selector answers in a row before the mission is DONE
    confirm_unreachable: 8       # "frontiers but no path" answers in a row before DONE (costmaps cleared halfway)
    max_consecutive_failures: 8  # failed goals in a row before the mission is FAILED
    max_consecutive_recoveries: 6  # recoveries in a row without reaching a goal: FAILED
    recovery_enabled: true
    jump_check_s: 0.5            # map -> odom is sampled this often ...
    jump_distance_m: 0.5         # ... a step larger than this ...
    jump_yaw_rad: 0.4            # ... or this counts as a localization jump
    backup_m: 0.3                # recovery from "stuck": clear costmaps, back up
    backup_speed_mps: 0.1
    rescan_rad: 6.283            # recovery from a jump: stop, spin once, clear costmaps
    verify_enabled: false        # set by the launch argument verify:=true
    verify_min_hits: 12          # a candidate needs this many hits to be worth a visit
    verify_max_attempts: 2       # visits per pin
    verify_dwell_s: 6.0          # sim seconds spent at the viewpoint
    verify_radii_m: [1.5, 1.75, 2.0]   # viewpoint distances from the pin
    # Kidnap detection and global relocalization (relocalize.py, docs/PHASE10.md). Thresholds from the
    # offline calibration on 16 recorded missions (scripts/reloc_calibrate.sh).
    relocalization_enabled: true
    kidnap_check_s: 0.5          # the scan is scored against the map this often (sim seconds)
    kidnap_low_score: 0.35       # a score below this is a "low" check ...
    kidnap_checks: 3             # ... and this many in a row is a kidnap
    kidnap_good_score: 0.5       # the search uses the last map snapshot that scored at least this
    kidnap_min_known: 30         # scan endpoints on known cells needed to score at all
    kidnap_min_area_m2: 20.0     # no detection before the map has this much known area
    reloc_hit_dist_m: 0.15       # scale of the scan-to-wall distance score
    reloc_min_score: 0.85        # the best pose must score at least this ...
    reloc_min_margin: 0.15       # ... and beat the best pose >= 1 m away by this
    # Lost mode (docs/PHASE11.md): after a kidnap the search could not resolve, reset SLAM to a fresh
    # map, keep exploring, and search the saved pre-kidnap map until two confident matches agree with
    # the odometry between them. Limits set before the offline check, not tuned on it.
    lost_mode_enabled: true
    lost_check_s: 2.0            # search against the saved map this often (sim seconds)
    lost_min_known: 40           # endpoints on known cells of the saved map needed for a match
    lost_min_motion_m: 1.0       # two matches must be this far apart by odometry ...
    lost_min_turn_rad: 0.785     # ... or turned this much ...
    lost_tol_m: 0.3              # ... and their relative pose must equal the odometry change
    lost_tol_rad: 0.175          # within these
    lost_match_window_s: 60.0    # confident matches older than this are forgotten
    lost_grace_s: 120.0          # while lost, "no frontier" this soon after the reset is not DONE
    lost_wake_backup_m: 0.4      # after the reset: back up this far and spin once to start the new map
    reloc_repeat_window_s: 90.0  # a kidnap this soon after a re-seed goes to lost mode (no single-match re-seed)
